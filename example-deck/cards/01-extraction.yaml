area: extraction
cards:
  - id: extraction.extraction-yield
    style: definition
    topic: theory
    reverse: true
    front: Extraction yield
    back: The share of a coffee dose that dissolves into the cup, by mass.
    sources: [https://example.com/coffee/extraction]
    verified: 2026-09-12

  - id: extraction.under-over
    style: definition
    topic: theory
    front: Coffee tastes sour and thin. Under- or over-extracted?
    back: |
      **Under-extracted**

      - Sour, salty, thin body
      - Over-extraction reads bitter and drying
    sources: [https://example.com/coffee/extraction]
    verified: 2026-09-12

  - id: extraction.brew-ratio
    style: ratio
    topic: recipes
    front: Filter coffee starting ratio
    back: |
      **1:16 coffee to water by mass**

      - 60 g per litre
      - Espresso sits nearer 1:2
    sources: [https://example.com/coffee/ratios]
    verified: 2026-09-12

  - id: extraction.bloom
    style: technique
    topic: pour-over
    front: Why wet the grounds and wait before the main pour?
    back: |
      **Degassing: CO2 blocks water contact**

      - Roughly twice the dose in water
      - 30-45 s, longer for fresher coffee
    sources: [https://example.com/coffee/bloom]
    verified: 2026-09-12

  - id: extraction.grind-size-lever
    style: cloze
    topic: theory
    text: >-
      Grinding {{c1::finer}} raises extraction by increasing surface area, and it also
      {{c2::slows}} the flow rate through the bed.
    extra: Two effects at once, which is why grind is the first thing to adjust.
    sources: [https://example.com/coffee/grind]
    verified: 2026-09-12

  - id: extraction.channelling
    style: technique
    topic: espresso
    tags: [disputed]
    front: Espresso runs fast and tastes both sour and bitter at once. Why?
    back: |
      **Channelling: water found a path through the puck**

      - Part of the bed over-extracts, the rest barely wets
      - Distribution before tamping, not harder tamping
    sources: [https://example.com/coffee/channelling]
    verified: 2026-09-12
