# Development only. The shipped scripts declare their own dependencies inline (PEP 723)
# and are run by uv, so nobody installing this plugin ever installs a package.
[project]
name = "ancci-dev"
version = "0"
description = "Development environment for the ancci scripts and their tests"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0",
    "pydantic>=2.8",
    "pygments>=2.18",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
